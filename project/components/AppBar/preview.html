<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>AppBar</title></head>
<body>
<div class="sas-page">
  <header class="sas-appbar">
    <a class="sas-appbar__brand" href="#"><svg data-sas-icon="spool"></svg>SewAndSo</a>
    <div class="sas-appbar__end">
      <button class="sas-button sas-button--outline sas-button--icon" type="button" aria-label="New project"><svg data-sas-icon="plus"></svg></button>
      <div class="sas-theme-switch" role="radiogroup" aria-label="Color mode">
        <button class="sas-theme-switch__option" type="button" role="radio" aria-checked="true" data-sas-theme="light" aria-label="Light"><span class="sas-theme-switch__disc" data-theme="light"></span></button>
        <button class="sas-theme-switch__option" type="button" role="radio" aria-checked="false" data-sas-theme="colorful" aria-label="Colorful"><span class="sas-theme-switch__disc" data-theme="colorful"></span></button>
        <button class="sas-theme-switch__option" type="button" role="radio" aria-checked="false" data-sas-theme="dark" aria-label="Dark"><span class="sas-theme-switch__disc" data-theme="dark"></span></button>
      </div>
    </div>
  </header>
</div>
<script>SewAndSo.hydrate(document);</script>
</body>
</html>
