<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Button</title></head>
<body>
<div class="sas-page">
  <div class="sas-actions">
    <button class="sas-button" type="button"><svg data-sas-icon="needle"></svg>Keep sewing</button>
    <button class="sas-button sas-button--tonal" type="button"><svg data-sas-icon="camera"></svg>Add photo</button>
    <button class="sas-button sas-button--outline" type="button">Not now</button>
    <button class="sas-button" type="button" disabled>Press</button>
  </div>
  <div class="sas-actions">
    <button class="sas-button sas-button--icon" type="button" aria-label="New project"><svg data-sas-icon="plus"></svg></button>
    <button class="sas-button sas-button--tonal sas-button--icon" type="button" aria-label="Open the pattern"><svg data-sas-icon="pattern"></svg></button>
    <button class="sas-button sas-button--outline sas-button--icon" type="button" aria-label="Close"><svg data-sas-icon="close"></svg></button>
    <button class="sas-button" type="button" data-hue="plum"><svg data-sas-icon="scissors"></svg>Cut</button>
    <button class="sas-button" type="button" data-hue="marigold"><svg data-sas-icon="iron"></svg>Press</button>
  </div>
</div>
<script>SewAndSo.hydrate(document);</script>
</body>
</html>
