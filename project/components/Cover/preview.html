<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>SewAndSo</title>
<style>
  html, body { margin: 0; height: 100%; }
  body { background: var(--canvas); color: var(--ink); font-family: var(--font-sans); overflow: hidden; }
  .cover { position: relative; width: 960px; height: 288px; overflow: hidden; }
  .art { position: absolute; top: 0; left: 480px; width: 480px; height: 288px; overflow: hidden; }
  .art svg { display: block; width: 480px; height: 288px; }
  .rose { fill: var(--rose); }
  .marigold { fill: var(--marigold); }
  .teal { fill: var(--teal); }
  .plum { fill: var(--plum); }
  .tint { fill: var(--tint-cornflower); }
  .hole { fill: var(--canvas); }
  .stitch { fill: var(--surface); }
  .name { position: absolute; left: 32px; bottom: 32px; max-width: 440px; margin: 0; font-size: 88px; line-height: 0.92; font-weight: 800; letter-spacing: -0.03em; }
</style>
</head>
<body>
<div class="cover">
  <div class="art" aria-hidden="true">
    <svg viewBox="0 0 480 288" width="480" height="288">
      <!--
        blocks      rose 112x240 slab bled off the top (Colorful's primary) · teal 112x112 disc (Light's primary) · plum 224x216 bleeding off the right · marigold 176x48 pill (Dark's primary) · tint-cornflower 112x96 relief
        arrangement one tall slab with satellites on a space-4 gutter, bottoms on one line space-6 above the edge
        pattern     a literal motif, "thread, buttons and stitches": four button holes cut into the teal disc and a running stitch of surface pills across the plum slab
        scales      sides in space-2 multiples; gutters space-4; stitch pitch space-8; corners radius-md and radius-lg, pills and discs rx = half the short side
      -->
      <rect class="rose" x="16" y="-24" width="112" height="240" rx="18"/>
      <rect class="tint" x="16" y="232" width="112" height="96" rx="18"/>
      <rect class="teal" x="144" y="104" width="112" height="112" rx="56"/>
      <circle class="hole" cx="188" cy="148" r="7"/>
      <circle class="hole" cx="212" cy="148" r="7"/>
      <circle class="hole" cx="188" cy="172" r="7"/>
      <circle class="hole" cx="212" cy="172" r="7"/>
      <rect class="marigold" x="144" y="232" width="176" height="48" rx="24"/>
      <rect class="plum" x="272" y="16" width="224" height="200" rx="28"/>
      <rect class="stitch" x="288" y="92" width="20" height="8" rx="4"/>
      <rect class="stitch" x="320" y="92" width="20" height="8" rx="4"/>
      <rect class="stitch" x="352" y="92" width="20" height="8" rx="4"/>
      <rect class="stitch" x="384" y="92" width="20" height="8" rx="4"/>
      <rect class="stitch" x="416" y="92" width="20" height="8" rx="4"/>
      <rect class="stitch" x="448" y="92" width="20" height="8" rx="4"/>
      <rect class="stitch" x="288" y="132" width="20" height="8" rx="4"/>
      <rect class="stitch" x="320" y="132" width="20" height="8" rx="4"/>
      <rect class="stitch" x="352" y="132" width="20" height="8" rx="4"/>
      <rect class="stitch" x="384" y="132" width="20" height="8" rx="4"/>
      <rect class="stitch" x="416" y="132" width="20" height="8" rx="4"/>
      <rect class="stitch" x="448" y="132" width="20" height="8" rx="4"/>
    </svg>
  </div>
  <h1 class="name">SewAndSo</h1>
</div>
</body>
</html>
