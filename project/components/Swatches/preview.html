<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Swatches</title></head>
<body>
<div class="sas-page">
  <div class="sas-panel sas-stack sas-stack--tight">
    <span class="sas-field__label" id="thread-label">Thread</span>
    <div class="sas-swatches" role="radiogroup" aria-labelledby="thread-label">
      <button class="sas-swatch" type="button" role="radio" aria-checked="true" data-value="rose" data-hue="rose" aria-label="Rose"><svg data-sas-icon="check"></svg></button>
      <button class="sas-swatch" type="button" role="radio" aria-checked="false" data-value="madder" data-hue="madder" aria-label="Madder"><svg data-sas-icon="check"></svg></button>
      <button class="sas-swatch" type="button" role="radio" aria-checked="false" data-value="marigold" data-hue="marigold" aria-label="Marigold"><svg data-sas-icon="check"></svg></button>
      <button class="sas-swatch" type="button" role="radio" aria-checked="false" data-value="fern" data-hue="fern" aria-label="Fern"><svg data-sas-icon="check"></svg></button>
      <button class="sas-swatch" type="button" role="radio" aria-checked="false" data-value="teal" data-hue="teal" aria-label="Teal"><svg data-sas-icon="check"></svg></button>
      <button class="sas-swatch" type="button" role="radio" aria-checked="false" data-value="cornflower" data-hue="cornflower" aria-label="Cornflower"><svg data-sas-icon="check"></svg></button>
      <button class="sas-swatch" type="button" role="radio" aria-checked="false" data-value="plum" data-hue="plum" aria-label="Plum"><svg data-sas-icon="check"></svg></button>
    </div>
  </div>
</div>
<script>SewAndSo.hydrate(document);</script>
</body>
</html>
