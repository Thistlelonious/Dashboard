<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>overlap-controls</title>
<style>
  body { margin: 24px; font: 18px/1.5 system-ui, sans-serif; color: #1a1a1a; background: #ffffff; }
  button, a.btn { display: inline-flex; align-items: center; min-height: 48px; min-width: 48px; padding: 0 16px; font: inherit; border: 2px solid #1a1a1a; background: #ffffff; color: #1a1a1a; border-radius: 8px; text-decoration: none; }

  .stage { position: relative; height: 120px; }
  .stage button { position: absolute; top: 0; width: 140px; }
  .one { left: 0; justify-content: flex-start; }
  .two { left: 120px; justify-content: flex-end; }
</style>
</head>
<body>
<div class="stage">
  <button type="button" class="one">One</button>
  <button type="button" class="two">Two</button>
</div>
</body>
</html>
